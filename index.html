<style>
/* Layout: one narrow column, tabs on top, month chips shared by all three views */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --ink:#15223b; --muted:#5b6882; --line:#dde3ee;
  --accent:#0e7c86; --accent-ink:#ffffff; --mark:#ffd45c; --good:#1c8a4c; --good-bg:#e0f5e8; --bad:#c23a3a; --bad-bg:#fbe5e5;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1626; --surface:#18223a; --ink:#eaf0fb; --muted:#9aa8c4; --line:#2a3656;
  --accent:#43c0cb; --accent-ink:#06222a; --mark:#e8b934; --good:#5fd08b; --good-bg:#17382a; --bad:#ff8a8a; --bad-bg:#3d1f26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1626; --surface:#18223a; --ink:#eaf0fb; --muted:#9aa8c4; --line:#2a3656;
  --accent:#43c0cb; --accent-ink:#06222a; --mark:#e8b934; --good:#5fd08b; --good-bg:#17382a; --bad:#ff8a8a; --bad-bg:#3d1f26; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:600 1.9rem/1.15 var(--display);margin:0;text-wrap:balance}
h1 mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;padding:0 .1em}
.sub{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line)}
.tab{font:600 1rem var(--display);background:none;border:0;color:var(--muted);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .875rem var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.count{color:var(--muted);font-size:.875rem}
/* study */
.grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.grp h3{margin:0;font:600 1.05rem var(--display)}
.grp h3 span{color:var(--muted);font-weight:500;font-size:.9rem;margin-right:6px}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,2fr) auto;gap:4px 12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.ex{grid-column:1/-1;color:var(--muted);font-size:.875rem;padding-left:10px;border-left:3px solid var(--mark)}
.w{font-weight:700}.id{color:var(--accent);font-weight:600}.sn{color:var(--muted)}
.say{font:600 .8rem var(--body);background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 8px;cursor:pointer}
@media(max-width:560px){.row{grid-template-columns:1fr auto}.row .sn{grid-column:1/-1}}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.btn{font:600 1rem var(--display);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.card{min-height:200px;border:2px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;cursor:pointer;background:var(--bg);width:100%;color:var(--ink);font:inherit}
.card .big{font:600 2.2rem/1.2 var(--display);overflow-wrap:anywhere}
.card .hint{color:var(--muted);font-size:.85rem}
.card .back{color:var(--accent);font:600 1.4rem var(--display)}
.q{font:600 1.5rem/1.3 var(--display);text-align:center;overflow-wrap:anywhere}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{font:600 1.05rem var(--body);background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:center;overflow-wrap:anywhere}
.opt.ok{background:var(--good-bg);border-color:var(--good)}.opt.no{background:var(--bad-bg);border-color:var(--bad)}
input[type=text],select{font:1.1rem var(--body);padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.fb{text-align:center;font-weight:700;min-height:1.5em}.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}
.blank{font:600 1.4rem var(--display);letter-spacing:.15em;text-align:center;color:var(--muted)}
.score{font:600 3rem var(--display);text-align:center}
.wrong{margin:0;padding-left:20px}.wrong li{padding:2px 0}
label{font-weight:700;font-size:.9rem;display:block;margin-bottom:4px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.fields{grid-template-columns:1fr}}
</style>
</head>

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function viewKartu(){

  if(!q||q.stage==="setup"){
    var n=words(S.month).length;
    $("#view").innerHTML='<div class="panel"><div class="fields"><div><label for="mode">Jenis soal</label><select id="mode"><option value="ie">Arti → pilih kata Inggris</option><option value="ty">Arti → ketik kata Inggris</option><option value="ei">Kata Inggris → pilih arti</option></select></div><div><label for="num">Jumlah soal</label><select id="num"><option>10</option><option>20</option><option value="all">Semua ('+n+')</option></select></div></div><div class="btns"><button class="btn" id="go">Mulai kuis</button></div></div>';
    return;
  }
  if(q.stage==="done"){
    var h='<div class="panel"><div class="score">'+q.score+' / '+q.list.length+'</div>';
    if(q.wrong.length){h+='<div><strong>Yang masih salah:</strong><ul class="wrong">'+q.wrong.map(function(w){return'<li><b>'+esc(w.w)+'</b>: '+esc(w.a)+'</li>'}).join("")+'</ul></div>'}
    else h+='<p style="text-align:center">Semua benar.</p>';
    h+='<div class="btns">'+(q.wrong.length?'<button class="btn" id="redo">Ulangi yang salah</button>':'')+'<button class="btn alt" id="again">Kuis baru</button></div></div>';
    $("#view").innerHTML=h;return;
  }
  var w=q.list[q.i],h='<div class="panel"><div class="qmeta"><span>Soal '+(q.i+1)+' dari '+q.list.length+'</span><span>Benar: '+q.score+'</span></div><div class="bar"><i style="width:'+(q.i/q.list.length*100)+'%"></i></div>';
  if(q.mode==="ei"){
    h+='<div class="q">'+esc(w.w)+'</div><div class="opts" id="opts">'+q.opts.map(function(o){return'<button class="opt" data-o="'+esc(o.a)+'">'+esc(o.a)+'</button>'}).join("")+'</div>';
  }else if(q.mode==="ie"){
    h+='<div class="q">'+esc(w.a)+'</div><div class="opts" id="opts">'+q.opts.map(function(o){return'<button class="opt" data-o="'+esc(o.w)+'">'+esc(o.w)+'</button>'}).join("")+'</div>';
  }else{
    var pat=w.w.replace(/[A-Za-z0-9]/g,"_ ").replace(/ +/g," ");
    h+='<div class="q">'+esc(w.a)+'</div><div class="blank" aria-label="'+w.w.length+' huruf">'+esc(pat)+'</div><form id="tf" style="display:flex;flex-direction:column;gap:10px"><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Jawaban"><button class="btn" id="chk" type="submit">Periksa</button></form>';
  }
  h+='<div class="fb" id="fb"></div><div class="btns" id="nx" hidden><button class="btn" id="nextq">'+(q.i+1===q.list.length?"Lihat nilai":"Soal berikutnya")+'</button></div></div>';
  $("#view").innerHTML=h;
  if(q.mode==="ty"){$("#ans").focus()}
}
function startQuiz(list,mode){
  var all=words("all");
  S.quiz={stage:"play",mode:mode,list:list,i:0,score:0,wrong:[],done:false};
  list.forEach(function(w){var o=shuffle(all.filter(function(x){return x.w!==w.w&&x.a!==w.a}));var pick=[],seen={};o.forEach(function(x){if(pick.length<3&&!seen[x.a]){seen[x.a]=1;pick.push(x)}});w.opts=shuffle(pick.concat([w]))});
  S.quiz.opts=null;nextOpts();viewKuis();
}
function nextOpts(){var q=S.quiz;if(q.stage==="play")q.opts=q.list[q.i].opts}
function answer(ok,correctText){
  var q=S.quiz;if(q.done)return;q.done=true;
  if(ok)q.score++;else q.wrong.push(q.list[q.i]);
  var fb=$("#fb");fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"Benar!":"Jawaban yang benar: "+correctText;
  $("#nx").hidden=false;$("#nextq").focus();
}
function render(){tabs();chips();if(S.view==="belajar")viewBelajar();else if(S.view==="kartu")viewKartu();else viewKuis()}
function setView(v){S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){}render()}

document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.v)return setView(t.dataset.v);
  if(t.dataset.m){S.month=t.dataset.m;S.card=null;if(S.quiz&&S.quiz.stage!=="play")S.quiz=null;return render()}
  if(t.dataset.say!==undefined)return speak(t.dataset.say);
  var c=S.card,q=S.quiz;
  if(t.id==="flip"){c.flip=!c.flip;return viewKartu()}
  if(t.id==="next"){c.i=(c.i+1)%c.list.length;c.flip=false;return viewKartu()}
  if(t.id==="prev"){c.i=(c.i-1+c.list.length)%c.list.length;c.flip=false;return viewKartu()}
  if(t.id==="shuf"){S.card=null;return viewKartu()}
  if(t.id==="go"){var n=$("#num").value,l=shuffle(words(S.month));if(n!=="all")l=l.slice(0,+n);return startQuiz(l,$("#mode").value)}
  if(t.id==="again"){S.quiz=null;return viewKuis()}
  if(t.id==="redo"){return startQuiz(shuffle(q.wrong),q.mode)}
  if(t.id==="nextq"){q.done=false;q.i++;if(q.i>=q.list.length){q.stage="done"}else nextOpts();return viewKuis()}
  if(t.classList.contains("opt")&&q&&!q.done){
    var w=q.list[q.i],correct=q.mode==="ei"?w.a:w.w,ok=t.dataset.o===correct;
    document.querySelectorAll(".opt").forEach(function(b){b.disabled=true;if(b.dataset.o===correct)b.classList.add("ok")});
    if(!ok)t.classList.add("no");
    if(q.mode==="ie")speak(w.w);
    answer(ok,correct);
  }
});
document.addEventListener("submit",function(e){
  if(e.target.id!=="tf")return;e.preventDefault();
  var q=S.quiz;if(q.done)return;var w=q.list[q.i];
  var ok=norm($("#ans").value)===norm(w.w);
  $("#ans").disabled=true;$("#chk").hidden=true;speak(w.w);answer(ok,w.w);
});
var h0=(location.hash||"").slice(1);if(["belajar","kartu","kuis"].indexOf(h0)>=0)S.view=h0;
render();
</script>
